version: 2

models:
  - name: customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: transactions
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null

  - name: interactions
    columns:
      - name: interaction_id
        tests:
          - unique
          - not_null

  - name: campaigns
    columns:
      - name: campaign_id
        tests:
          - unique
          - not_null

  - name: reviews
    columns:
      - name: review_id
        tests:
          - unique
          - not_null

  - name: support_tickets
    columns:
      - name: ticket_id
        tests:
          - unique
          - not_null
  - name: customer_profile
  - name: rfm_metrics
  - name: engagement_metrics
  - name: support_metrics
  - name: churn_signals
  - name: churn_risk_score
  - name: customer_health_score

sources:
  - name: raw
    schema: raw
    tables:
      - name: customers
      - name: transactions
      - name: interactions     
      - name: campaigns
      - name: customer_reviews
      - name: support_tickets